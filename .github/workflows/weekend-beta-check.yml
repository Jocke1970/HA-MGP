name: MotoGP weekend beta regression

on:
  workflow_dispatch:
  push:
    branches: [dev, beta]
    paths:
      - 'custom_components/motogp_sensor/**'
      - 'tests/test_weekend_regressions.py'
      - 'tests/test_standings_enrichment.py'
      - 'tests/test_qualifying_grid.py'
      - 'tests/test_session_history_ws.py'
      - '.github/workflows/weekend-beta-check.yml'
  pull_request:
    branches: [beta, main]
    paths:
      - 'custom_components/motogp_sensor/**'
      - 'tests/test_weekend_regressions.py'
      - 'tests/test_standings_enrichment.py'
      - 'tests/test_qualifying_grid.py'
      - 'tests/test_session_history_ws.py'
      - '.github/workflows/weekend-beta-check.yml'

permissions:
  contents: read

jobs:
  weekend-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile integration
        run: python -m compileall -q custom_components/motogp_sensor
      - name: Run weekend regressions
        run: python tests/test_weekend_regressions.py
      - name: Verify bundled frontend and safe static paths
        run: python tests/test_frontend_package.py
      - name: Validate authenticated on-demand lap history and spoiler fences
        run: |
          python -m unittest discover -s tests -p 'test_lap_history_*.py' -v
      - name: Validate championship numbers and verified official team colors
        run: python -m unittest discover -s tests -p 'test_standings_enrichment.py' -v
      - name: Validate Q1 eliminations and official grid positions
        run: python -m unittest discover -s tests -p 'test_qualifying_grid.py' -v
      - name: Read-only archived session authorization and observed-lap regressions
        run: python -m unittest discover -s tests -p 'test_session_history_ws.py' -v
      - name: Run archive regressions
        run: python -m unittest discover -s tests -p 'test_session_lap_archive.py' -v
