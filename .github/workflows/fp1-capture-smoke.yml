name: FP1 diagnostic capture smoke
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/**'
      - 'tests/test_fp1_capture.py'
      - '.github/workflows/fp1-capture-smoke.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/diagnostics/**'
      - 'tests/test_fp1_capture.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/diagnostics/capture_fp1.py
      - run: python tests/test_fp1_capture.py
