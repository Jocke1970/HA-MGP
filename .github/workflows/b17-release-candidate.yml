name: HA-MGP b27 release candidate gate

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches: [beta]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version and byte-identical HACS aliases
        run: |
          python3 tests/test_frontend_package.py
          python3 tests/test_local_imports.py
          python3 -m unittest discover -s tests -p 'test_session_history_ws.py' -v
          python3 -m compileall -q custom_components/motogp_sensor
          python3 -m unittest discover -s tests -p 'test_api_diagnostics.py' -v
          python3 -m unittest discover -s tests -p 'test_api_event_archive.py' -v
          python3 -m unittest discover -s tests -p 'test_weather_conditions.py' -v
          python3 -m unittest discover -s tests -p 'test_broadcast_schedule.py' -v
          python3 -m unittest discover -s tests -p 'test_event_results_ws.py' -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('custom_components/motogp_sensor/manifest.json').read_text())
          assert m['version']=='2026.11.0b27'
          code=Path('custom_components/motogp_sensor/coordinator.py').read_text()
          assert 'async_get_entry_list(' not in code, 'Unsupported entry endpoint must not be called in b22'
          assert 'PulseliveDiagnostics' in code, 'Passive diagnostics missing'
          print('PASS: b23 manifest, static routing, no unverified entry API calls')
          PY
      - name: Verify packaged JS and regression behavior
        run: |
          node --check custom_components/motogp_sensor/www/ha-mgp.js
          node --check custom_components/motogp_sensor/www/ha-motogp-next.js
          node tests/frontend-pre-session.cjs
          node tests/frontend-next-header-track.cjs frontend/ha-mgp-header-track.js
          node tests/frontend-active-chip.cjs
          node tests/frontend-live-freshness.cjs custom_components/motogp_sensor/www/ha-mgp.js
          node tests/frontend-mobile-laps.cjs custom_components/motogp_sensor/www/ha-mgp.js
          node tests/frontend-calendar.cjs
          node tests/frontend-i18n.cjs
      - name: Inspect compiled HACS JS sections and source provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('custom_components/motogp_sensor/www/ha-mgp.js').read_text(encoding='utf-8')
          parts=[
            ('ui','/* MotoGP Next UI preview: bundled after lap-stats.'),
            ('mobile','/* MotoGP Next responsive timing and authenticated lap-history dialog.'),
            ('qual','/* MotoGP Next qualifying grid: echelon'),
            ('header','/* MotoGP Next circuit layout & track weather'),
            ('history','/* MotoGP Next: observed historical lap summaries'),
            ('i18n','/* HA-MGP UI localization.'),
            ('calendar','/* HA-MGP season calendar:'),
          ]
          index=[src.index(marker) for _,marker in parts]
          assert index==sorted(index) and len(set(index))==len(index)
          assert '0.3.0-dev.61' in src
          assert 'header-track-weather-20261109-04' in src
          assert 'mgp-pre-grid-scroll' in src
          assert '/local/ha-mgp/circuits/' in src
          assert 'data-mgp-weather-diagnostics' in src
          for i,(name,_) in enumerate(parts):
            start=index[i]
            end=index[i+1] if i+1<len(index) else len(src)
            chunk=src[start:end]
            assert len(chunk)>1000, f'Unexpectedly short {name}'
            Path('/tmp/ha-mgp-b22-'+name+'.js').write_text(chunk,encoding='utf-8')
          PY
          for name in ui mobile qual header history i18n calendar; do
            node --check "/tmp/ha-mgp-b22-$name.js"
          done
          node tests/frontend-next-qual-grid.cjs /tmp/ha-mgp-b22-qual.js
          node tests/frontend-next-header-track.cjs /tmp/ha-mgp-b22-header.js

