name: Package MotoGP HACS beta

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/hacs-beta-package.yml'
      - 'custom_components/motogp_sensor/**'
      - 'tests/test_weekend_regressions.py'
      - 'tests/test_standings_enrichment.py'
      - 'tests/test_session_lap_archive.py'
      - 'tests/test_frontend_package.py'
      - 'tests/frontend-live-freshness.cjs'
      - 'tests/frontend-mobile-laps.cjs'
      - 'tests/frontend-next-ui-preview.cjs'
      - 'tests/frontend-next-one.cjs'
      - 'tests/frontend-next-qual-grid.cjs'
      - 'tests/frontend-next-header-track.cjs'
      - 'tests/test_qualifying_grid.py'
      - 'tests/test_lap_history_ws.py'
      - 'tests/test_lap_history_response.py'
      - 'docs/hacs-beta-release-notes.md'

permissions:
  contents: write

concurrency:
  group: motogp-hacs-beta-package
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile integration
        run: python -m compileall -q custom_components/motogp_sensor
      - name: Run backend and archive regression tests
        run: |
          python tests/test_weekend_regressions.py
          python -m unittest discover -s tests -p 'test_session_lap_archive.py' -v
          python -m unittest discover -s tests -p 'test_lap_history_*.py' -v
          python -m unittest discover -s tests -p 'test_standings_enrichment.py' -v
          python -m unittest discover -s tests -p 'test_qualifying_grid.py' -v
      - name: Verify bundled frontend and safe static registration
        run: |
          python tests/test_frontend_package.py
          node --check custom_components/motogp_sensor/www/ha-motogp-next.js
          node --check custom_components/motogp_sensor/www/ha-motogp-card.js
          TZ=Europe/Stockholm node tests/frontend-live-freshness.cjs custom_components/motogp_sensor/www/ha-motogp-next.js
          TZ=Europe/Stockholm node tests/frontend-mobile-laps.cjs custom_components/motogp_sensor/www/ha-motogp-next.js
      - name: Run Next, standings, Q1-grid and circuit tests against shipped HACS JavaScript
        env:
          TZ: Europe/Stockholm
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("custom_components/motogp_sensor/www/ha-motogp-next.js").read_text(encoding="utf-8")
          markers = [
              "/* MotoGP Next UI preview: bundled after lap-stats.",
              "/* MotoGP Next responsive timing and authenticated lap-history dialog.",
              "/* MotoGP Next qualifying grid: echelon",
              "/* MotoGP Next circuit layout & track weather",
          ]
          positions = [source.index(marker) for marker in markers]
          assert positions == sorted(positions) and len(set(positions)) == 4
          assert "STATUS OKÄND:" not in source
          assert "qualifying_q1_eliminated" in source
          assert "MELLAN PASSEN" in source
          assert "leaderboard=shown.map" in source
          parts = {
              "base": source[:positions[0]],
              "ui": source[positions[0]:positions[1]],
              "qual": source[positions[2]:positions[3]],
              "header": source[positions[3]:],
          }
          for name, content in parts.items():
              assert len(content) > 1000, f"Unexpectedly short {name} source"
              Path(f"/tmp/ha-motogp-b7-{name}.js").write_text(content, encoding="utf-8")
          PY
          for name in base ui qual header; do
            node --check "/tmp/ha-motogp-b7-$name.js"
          done
          node tests/frontend-next-one.cjs /tmp/ha-motogp-b7-base.js
          node tests/frontend-next-ui-preview.cjs /tmp/ha-motogp-b7-ui.js
          node tests/frontend-next-qual-grid.cjs /tmp/ha-motogp-b7-qual.js
          node tests/frontend-next-header-track.cjs /tmp/ha-motogp-b7-header.js
      - name: Verify HACS package metadata and runtime files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('custom_components/motogp_sensor')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['domain'] == 'motogp_sensor'
          assert manifest['version'] == '2026.11.0b7'
          assert manifest.get('codeowners') == ['@Jocke1970']
          assert {'http', 'frontend'}.issubset(manifest['dependencies'])
          required = {
              '__init__.py', 'api.py', 'const.py', 'coordinator.py',
              'helpers.py', 'schedule_time.py', 'sensor.py',
              'session_lap_archive.py', 'web_assets.py',
              'lap_history_ws.py', 'lap_history_response.py',
              'qualifying_grid.py',
              'www/ha-motogp-next.js', 'www/ha-motogp-card.js',
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          assert not missing, f'Missing runtime files: {missing}'
          hacs = json.loads(Path('hacs.json').read_text(encoding='utf-8'))
          assert hacs.get('name')
          assert not hacs.get('content_in_root')
          assert not hacs.get('zip_release')
          print('Verified HACS beta: 2026.11.0b7 including Next frontend 0.3.0-dev.14')
          PY
      - name: Publish tagged GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=2026.11.0b7
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the immutable prerelease untouched."
            gh release view "$TAG" --json tagName,isPrerelease,url,targetCommitish
            exit 0
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --prerelease \
            --title 'MotoGP Sensor 2026.11.0b7 — circuit, weather and full Q1/Q2 grid' \
            --notes-file docs/hacs-beta-release-notes.md
          gh release view "$TAG" --json tagName,isPrerelease,url,targetCommitish
